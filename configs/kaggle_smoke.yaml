experiment:
  output_dir: /kaggle/working/new-pruning-outputs/kaggle-smoke
  seeds: [0]
  device: cuda
dataset:
  name: cifar100
  fake_data: false
  root: /kaggle/working/data/cifar100
  num_classes: 100
  feature_subset_size: 2000
  download: true
  num_workers: 2
model:
  projection_dim: 128
compression:
  train_widths: [0.25, 0.50, 0.75, 1.00]
  eval_widths: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
training:
  epochs: 20
  width_loss_reduction: mean
  batch_size: 128
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  kd_lambda: 1.0
  kd_temperature: 2.0
evaluation:
  batch_size: 256
  bn_calibration_batches: 50
features:
  normalize: l2
geometry:
  method: sliced_wasserstein
  control_methods: [euclidean_mean]
  num_projections: 128
  projection_seed: 0
  bootstrap_samples: 1000
  cliff_robust_z: 2.5
oracle:
  enabled: false
  widths: [0.30, 0.40, 0.60, 0.80]
  epochs: 1
