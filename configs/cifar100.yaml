experiment:
  output_dir: outputs/cifar100
  seeds: [0, 1, 2]
  device: auto
dataset:
  name: cifar100
  root: data
  num_classes: 100
  feature_subset_size: 2000
  download: true
  num_workers: 4
model:
  projection_dim: 128
compression:
  train_widths: [0.25, 0.50, 0.75, 1.00]
  eval_widths: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
training:
  epochs: 200
  batch_size: 128
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  kd_lambda: 1.0
  kd_temperature: 2.0
evaluation:
  batch_size: 256
  bn_calibration_batches: 50
features:
  normalize: l2
geometry:
  method: sliced_wasserstein
  control_methods: [euclidean_mean, cosine, gaussian_w2, mmd]
  num_projections: 256
  projection_seed: 0
  bootstrap_samples: 1000
  cliff_robust_z: 2.5
oracle:
  enabled: true
  widths: [0.30, 0.40, 0.60, 0.80]
  epochs: 30
