experiment:
  output_dir: /kaggle/working/new-pruning-outputs/kaggle-rq2-anchor
  development_seed: 0
  confirmatory_seeds: [1, 2]
  device: cuda
dataset:
  name: cifar100
  fake_data: false
  root: /kaggle/working/data/cifar100
  num_classes: 100
  validation_size: 5000
  split_seed: 20260911
  bn_calibration_size: 6400
  feature_subset_size: 2000
  download: true
  num_workers: 0
model:
  backbone: slimmable_resnet18
  projection_dim: 128
compression:
  # Replaced by the frozen seed-0 geometry selection before any RQ2 training.
  train_widths: [0.25, 0.50, 0.75, 1.00]
  eval_widths: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
training:
  epochs: 100
  phase_1_epochs: 50
  total_epochs: 100
  smoke_epochs: 2
  anchors_per_batch: 4
  batch_size: 128
  learning_rate: 0.1
  extension_learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  kd_lambda: 1.0
  kd_temperature: 2.0
evaluation:
  batch_size: 256
  bn_calibration_batches: 50
  bootstrap_replicates: 2000
  bootstrap_seed: 271828
representations:
  views: [learned_projection, backbone_padded, fixed_random_projection]
  backbone_padding_dim: 512
  random_projection_dim: 128
  random_seed: 424242
geometry:
  method: sliced_wasserstein
  num_projections: 128
  projection_seed: 0
decision:
  minimum_mean_effect: 0.002
  worst_accuracy_margin: 0.005
  full_width_accuracy_margin: 0.005
