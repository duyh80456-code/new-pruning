experiment:
  output_dir: outputs/smoke
  seeds: [0]
  device: auto
dataset:
  name: fake
  root: data
  num_classes: 10
  train_size: 128
  val_size: 64
  feature_subset_size: 48
  download: false
  num_workers: 0
model:
  projection_dim: 32
compression:
  train_widths: [0.25, 0.50, 0.75, 1.00]
  eval_widths: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
training:
  epochs: 1
  width_loss_reduction: mean
  batch_size: 16
  learning_rate: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  kd_lambda: 1.0
  kd_temperature: 2.0
evaluation:
  batch_size: 32
  bn_calibration_batches: 1
features:
  normalize: l2
geometry:
  method: sliced_wasserstein
  control_methods: [euclidean_mean, cosine, gaussian_w2, mmd]
  num_projections: 32
  projection_seed: 0
  bootstrap_samples: 100
  cliff_robust_z: 2.5
oracle:
  enabled: false
  widths: [0.30, 0.40, 0.60, 0.80]
  epochs: 1
