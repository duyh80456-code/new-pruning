# =========================== Branch BB ===========================
# K with the channels permuted once at epoch 10 so that the prefix
# holds the ones with the largest L1, the way Once-for-All reorders
# when it makes width elastic.
#
# US-Net decides at initialisation which channels a narrow subnet gets:
# weight[:k], and k counts from index zero. Nothing ever revisits that.
# OFA does revisit it, because in OFA width is the last axis made
# elastic and until that stage no position is asked for anything the
# others are not, so the ordering really is arbitrary.
#
# Here it may not be. Read on a finished K, the first quarter of the
# channels already is 96 to 98 per cent of the best quarter by every
# criterion tried, because the prefix runs at every sampled width and
# at 0.25 has to classify alone. What that reading cannot say is
# whether the prefix was already sorted at epoch 10, with ninety epochs
# left to benefit from fixing it. This branch is that question, and it
# prints the answer on the way past: the log line says how much of the
# best quarter the prefix held before the permutation ran.
#
# Once, not repeatedly. The permutation is free, but it throws away
# whatever co-adaptation the narrow widths have built with the channels
# they had, so doing it every epoch would keep paying that and never
# settle.
#
# The permutation is a symmetry of the full network, so width 1.00 must
# come out bit for bit unchanged and width 0.25 must not.
# tests/test_channel_reorder.py holds both, and holds that the
# optimizer's momentum buffers move with the weights - leaving those
# behind would feed every channel the velocity of whoever used to sit
# at its index, and nothing would crash.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bb_reorder_l1
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
reorder_epoch: 10
reorder_report: True
reorder_by: l1
feature_weight: 1.0
horizontal_where: feature
