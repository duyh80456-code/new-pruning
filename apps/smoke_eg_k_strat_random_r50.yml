# =========================== Branch EG ===========================
# K as DD (ResNet-50, post-ReLU read, feature transport from epoch 6,
# seed 1995) with the free widths drawn ten steps at a time, one per
# slice of [0.25, 1.0] as in DJ and DK, but dealt out at random
# (stratified_pairing: random): the 20 draws are shuffled and taken two
# at a time, so a step's pair is near or far by chance, as in US-Net,
# while the block still covers the range evenly. The missing cell of the
# draw-by-pairing table. Against DD (77.50) it isolates even coverage;
# against DK (77.31) and DJ (76.56) it isolates the gap.
#
# Runs alone on both T4s of a Kaggle session: train.py's DataParallel
# splits each batch of 256 into 128 per card. The transport still sees
# all 256 features (they are gathered before the loss), but BatchNorm
# normalizes 128 per card during training where every earlier ResNet-50
# run normalized 256 on one: a protocol difference, noted when EG is read.

num_gpus_per_job: 2
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 3

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_eg_k_strat_random_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature

# Deferred, K holds all four widths' graphs until the end of the step:
# 19.3 GB at batch 256 on ResNet-50, and a T4 has 15. Only the pair term
# needs two widths at once, and its gradient splits exactly into one part
# per side, so each width takes its part with the partner detached and is
# freed. Same gradient to a relative 5e-8 on ResNet-18, checked against
# the deferred path through train.py's own loop. Costs one extra forward
# without a graph per step.
split_pair_backward: True

feature_start_epoch: 2

# =========================== Sampling ===========================
width_sampling: stratified
stratified_pairing: random
stratified_block: 10
