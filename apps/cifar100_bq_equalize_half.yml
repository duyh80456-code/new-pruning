# =========================== Branch BQ ===========================
# K with each output channel's gradient divided by the square root of how
# many sampled widths wrote to it.
#
# Prefix slicing makes the sandwich rule hand out unequal learning rates
# along the channel index, by counting alone. Output channel i receives a
# gradient from every sampled width whose channel count exceeds i, so
# with {1.00, 0.25, w1, w2} and w uniform the expected count is 4.00 for
# the first quarter of channels, 3.00 just above it, and falls linearly
# to 1.00 at the last channel. Nothing in the loss intends that.
#
# Gradient Equilibrium does exactly this correction on the depth axis -
# a parameter several exits traverse accumulates more terms, so divide by
# the count - and has never been done on the channel axis.
#
# The exponent is the experiment, not the fix. Weight decay plus BN
# scale-invariance says the per-channel angular update converges to a
# value independent of gradient magnitude, which would cancel this
# on its own; but relaxation takes about 1/(eta*lambda) steps, here some
# fifty epochs of a hundred with cosine decay shrinking the target the
# whole time, so the cancelling is partial at best. Against that, the one
# convergence theory that covers nested-mask training requires no
# per-coordinate rescaling at all. q = 0.5 is the midpoint of a sweep
# whose endpoints are a real disagreement in the literature; q = 0 is
# this branch's own control, which is K.
#
# The count is taken from the widths each step actually drew, not from
# the closed form above, so nothing here assumes the sampler.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bq_equalize_half
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature
width_equalize_q: 0.5
