# =========================== Branch GE ===========================
# AlphaNet (ICML 2021): the inplace KL replaced by the adaptive
# alpha-divergence, on ResNet-18 on Tiny ImageNet: ES with kd_loss,
# alpha_min, alpha_max, alpha_iw_clip set as in cv_alphanet_r50 (the
# ResNet-50 row of the main table), seed 1995. Read against US-Net and
# the method on this setting at the same seed.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.tinyimagenet
data_transforms: data.tinyimagenet
data_loader: data.tinyimagenet
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 200
image_size: 64
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_ge_alphanet_r18_tiny
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 18
stem_stride: 2
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: alpha
horizontal_kd: False
alpha_min: -1.0
alpha_max: 1.0
alpha_iw_clip: 5.0
