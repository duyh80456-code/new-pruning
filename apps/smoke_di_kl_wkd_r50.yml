# =========================== Branch DI ===========================
# US-Net with its inplace distillation KL kept as it is and the
# Wasserstein term of WKD-L (Lv et al., NeurIPS 2024) added beside it:
# the 99 non-target classes, renormalised at temperature 8, transported
# under the class cost 1 - exp(-(1 - cos)) between classifier rows,
# Sinkhorn 0.05 x 10, weight 600 cosine-decayed over the last 37.5% of
# training, all as in DG. WKD-L's own target-class term is dropped,
# because the KL already covers the target class, and the students take
# no CE on the label, as in A. DG replaces KL with Wasserstein; DI keeps
# KL and adds it. Read both against BX (KL alone).

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_di_kl_wkd_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: kl_wkd
wkd_weight: 600.0
wkd_temperature: 8.0
wkd_reg: 0.05
wkd_iters: 10
wkd_decay_from: 0.625
horizontal_kd: False
