# =========================== Branch CG ===========================
#
# ResNet-50 version. Identical to CC apart from `depth: 50` and the log
# directory, so it is read against BX and BY (A and K on ResNet-50), not
# against the ResNet-18 table. ResNet-50 costs 2.34 times the MACs of
# ResNet-18 at every width.
#
# NASViT's gradient-conflict handling (Gong et al., ICLR 2022). Code:
# github.com/facebookresearch/NASViT.
#
# Same protocol as every row in the table: ResNet-18, CIFAR-100, 100
# epochs, batch 256, lr 0.2, the sixteen widths 0.25 to 1.00 read after BN
# post-statistics, seed 1995. Implemented from the authors' released code
# rather than from the paper alone, and where the two disagree the code
# wins; the differences are listed below.
#
# NASViT trains subnets with AlphaNet's adaptive alpha-divergence, so this
# is B (AlphaNet, 73.08 in this table) plus the one thing NASViT adds for
# supernet training: the widest width's gradient is held aside, and a
# subnet gradient whose inner product with it is negative is scaled up by
# clamp(-<g_s, g_l> / |g_s|^2, 0, 2) per parameter tensor before the two
# are added - misc/constrain_opt.py with proj_student False. Their main.py
# switches this on at epoch 100 of 400; 25 of 100 here.
#
# Differences. NASViT distils its largest subnet from two pretrained
# teachers and searches depth, kernel and resolution as well as width;
# none of that applies to a width-only CNN. grad_clip 5.0, which every
# branch here uses, clips the merged gradient; NASViT clips the subnet
# gradient before merging.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_cg_nasvit_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: alpha
alpha_min: -1.0
alpha_max: 1.0
alpha_iw_clip: 5.0
horizontal_kd: False

# =========================== cc_nasvit ===========================
conflict_from_epoch: 25
