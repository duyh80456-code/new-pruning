# =========================== Branch R ===========================
# K with maximum mean discrepancy in place of entropic transport.
#
# The control that speaks to the argument rather than the number. The case
# for transport here is that two feature clouds have no common support and
# an f-divergence needs one. MMD does not need one either, and it needs no
# transport plan and no fixed point iteration. So this separates "the
# clouds have to be matched as distributions" from "optimal transport in
# particular", which nothing run so far can tell apart.
#
# Gaussian kernel on clouds divided by their own spread, so the bandwidth
# is dimensionless and one setting serves every width.
#
# feature_weight is not 1.0 and that is deliberate. At equal weight
# this term contributes a gradient of 0.39 against 3.65 for the
# entropic version, so a comparison at 1.0 would confound the loss
# with how hard it pulls. scripts/calibrate_feature_weight.py
# measures both on the real model and reports the ratio; 9.5 is
# that ratio rounded. One measurement on an untrained model, so it
# is a starting point chosen by measurement, not a schedule.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_r_feature_mmd
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_loss: mmd
mmd_bandwidth: 1.0
feature_weight: 9.5
horizontal_where: feature
