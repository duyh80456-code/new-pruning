# =========================== Branch AJ ===========================
# The same per channel transport with an absolute gap, not a squared one.
#
# Squared weights the samples that disagree most and goes quiet as the two
# widths converge. p = 1 does neither: its gradient has constant
# magnitude, so it keeps pulling late in training where the squared
# version has nothing left to say. Measured at twenty times the gradient
# at equal weight, which is why feature_weight is 0.05.
#
# It collapsed. The narrow widths sit at ln(100) = 4.6052 from the second
# epoch onward, an output gone uniform and never recovered, and the
# finished table reads 1.00 at every width from 0.60 down. Mean 37.47.
# The wide end is unharmed and slightly ahead of A, +0.75 at width 1.00,
# so the term is not simply broken: it is fatal exactly where the width
# has the least capacity to absorb a gradient that never decays. The
# argument above is what caused it. A constant magnitude gradient keeps
# pulling after the squared form has gone quiet, and that is the same
# sentence read twice, once as a feature and once as the failure.
#
# Kept, not deleted. AN is the same exponent on the sliced form and died
# the same way, which is what makes this a property of the exponent
# rather than of the per channel cost.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_aj_channel_p1
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
wasserstein_p: 1.0
feature_loss: channel
feature_weight: 0.05
horizontal_where: feature
