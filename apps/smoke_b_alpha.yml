# =========================== Branch A ===========================
# AlphaNet, arXiv:2102.07954. The baseline that matters: "replace KL in
# supernet KD" is already occupied, so beating A while losing to B is not a
# result.
#
# One branch per GPU: each job is pinned to a single card with
# CUDA_VISIBLE_DEVICES and sees exactly one, so num_gpus_per_job is 1 and
# batch_size is what that one card carries. Two branches run at once.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: []

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_b_alpha
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: alpha
alpha_divergence_alphas: [-1.0, 1.0]
alpha_clamp: 5.0
horizontal_kd: False
