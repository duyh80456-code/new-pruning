# =========================== Branch BT ===========================
# K, width 0.25 alone for the first 25 epochs, and then that subnet is
# held still while the wider widths build on it.
#
# Freezing is what separates this from BU. After epoch 25 the gradient is
# zeroed over the block the width-0.25 subnet owns - conv and linear
# weights, and the BN scale and bias over the same channels, because
# otherwise the narrow subnet keeps drifting one affine parameter at a
# time and the branch would not test what it claims.
#
# The block is 710,576 of 11,210,432 weights, 6.3 per cent. The wider
# widths keep the rest, so this is a much lighter constraint than
# "freeze the small model" sounds - and the frozen part is exactly the
# prefix every width reads, which is where they disagree.
#
# One consequence worth stating: from epoch 25 the width-0.25 sample in
# the sandwich contributes no gradient to any weight, since every weight
# it touches is frozen. It is kept in the loop because its BN statistics
# still have to be gathered for the final calibration, and because
# dropping it would change the sampler as well and confound the two.
#
# The curriculum axis has one measured direction and it lost. The six
# warm-up branches train width 1.00 alone first and then admit the narrow
# end, and they average -0.38 against K. This is the other direction: the
# narrow end alone first.
#
# The argument is GrowTAS's, and it is about which subnet is coherent. A
# large subnet extended from a trained small one inherits the small one's
# layer-wise structure; a small one cropped out of a trained large one
# shows "significantly lower cosine similarity in the deeper layers",
# because cropping discards dependencies the depth had learned. If that
# holds, training the prefix first and letting the wider widths build on
# it is the right order and this project has had it backwards.
#
# Read against BF and BG, not against K alone. Those are the same
# intervention pointed the other way, so the four rows together are the
# curriculum axis rather than one more branch on the pile.
#
# Honest counterweight: thirteen measurements in the literature say the
# small end is rescued by weight sharing and the large end pays for it.
# If that is right here, settling the narrow end first protects something
# that is not broken while constraining the end that is.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bt_narrow_first_frozen
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature
narrow_first_epochs: 25
freeze_prefix_at: 0.25
