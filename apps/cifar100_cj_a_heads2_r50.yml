# =========================== Branch CJ ===========================
# A on ResNet-50 with head_groups: 2. Identical to BX otherwise, and to
# CH but for the number of heads. BX (one head), this, and the other
# head_groups branches on A sweep how finely the width range is cut.
# Each band has its own classifier over the shared backbone, the idea of
# SOLAR (WACV 2026) made to work on a continuous width range: every
# width reads the head of the band it falls in, so the network still
# runs at any width. The test widths fall 8 to a band: 0.25-0.60,
# 0.65-1.00. The sandwich rule always runs 0.25 and 1.00, so both heads
# train every step. More heads means less sharing between widths and
# fewer updates per head, and the sweep is there to find where those two
# cross. Read against BX and CH, top-1 and NLL both.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_cj_a_heads2_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
head_groups: 2
