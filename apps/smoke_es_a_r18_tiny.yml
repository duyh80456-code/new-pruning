# =========================== Branch ES ===========================
# US-Net as published (BX's recipe: inplace KL from the widest width,
# sandwich rule, seed 1995) on ResNet-18, Tiny ImageNet: the baseline EQ
# (SlimOT + WBH, same setting, same seed) is read against. 200 classes,
# 64x64, the official val split as the test set (data/tinyimagenet.py);
# stem_stride 2 so the stages see CIFAR's sizes. Same widths, schedule
# and batch as the ResNet-50 runs.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.tinyimagenet
data_transforms: data.tinyimagenet
data_loader: data.tinyimagenet
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 200
image_size: 64
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_es_a_r18_tiny
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 18
stem_stride: 2
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
