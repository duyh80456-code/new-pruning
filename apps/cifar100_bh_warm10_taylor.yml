# =========================== Branch BH ===========================
# The same window BD and BE make, sorted by what removing a channel
# would cost instead of by how loud it is.
#
# The narrow end is held back for the first 10 epochs so that only
# width 1.0 trains. US-Net otherwise has no window to sort inside: what
# makes a criterion meaningful is the prefix taking gradient at every
# width and having to classify alone at 0.25, and that is the same
# thing that sorts it. On a finished K the prefix already is 96 to 98
# per cent of the best quarter; on a fresh model it is 29.
#
# At epoch 10 the channels are ranked by |gamma * dL/dgamma| on the
# batch norm gains writing into each space. Zeroing a gain removes the
# channel, so this is the first order estimate of what that costs.
# Unlike weighting a loss by its own gradient, nothing here is
# circular: the permutation is not part of any objective, so the score
# is measured once between epochs and thrown away.
#
# It costs 8 forward and backward passes at width 1.0, once in
# the run. The gradients are dropped afterwards, or they would add
# themselves to the first real update of the epoch.
#
# Read against BD and BE, which take the same window and rank by L1
# instead. On K the two rank the channels the same way to 0.892 and
# their prefixes overlap 96 against 97 per cent, so this is here to say
# whether that still holds where the ordering has not settled - and
# against BF and BG, which take the window and do not sort at all.
#
# The total stays at 100 epochs and the warm-up comes out of the
# budget. Warm-up epochs run one width instead of four, so they cost
# less than a sandwich step: the branch spends less total compute than
# K, not more. The narrow widths get 90 epochs, which is a handicap
# and makes this a one sided test. A win is clean. A loss says nothing.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bh_warm10_taylor
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
narrow_start_epoch: 10
reorder_epoch: 10
reorder_by: taylor
taylor_batches: 8
reorder_report: True
feature_weight: 1.0
horizontal_where: feature
