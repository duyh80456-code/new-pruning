# =========================== Branch BM ===========================
# One ResNet-18 at width 1.00 and nothing else. The control this project
# has never run.
#
# All 65 configs train every width, so the table cannot say what the
# multi-width training costs the widest width - and that number gates a
# whole family of ideas. If 1.00 here lands well above A's 75.30, the
# hard label at the widest is being drowned by the narrow widths' much
# larger losses and the fix belongs at the label. If it lands near
# 75.30, that family is closed.
#
# The literature disagrees with itself on the size: the US-Net paper has
# MobileNet v1 better multi-width than solo by 0.9 and MobileNet v2
# worse by 0.3, while SlimCLR's supervised control is 76.6 solo against
# 76.0 slimmable. A reviewer asks for this number whichever way it goes.
#
# narrow_start_epoch past the end leaves training_widths returning
# [high] alone every epoch: one forward pass at width 1.00, no narrow
# widths, no distillation. Same path the warm-up branches use, pushed to
# the limit, so nothing here is a new code path.
#
# The sixteen widths are still tested afterwards, so this row also shows
# what a model trained at one width does when it is sliced anyway -
# the other thing nothing in this table has measured.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bm_solo_full
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
narrow_start_epoch: 999
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
