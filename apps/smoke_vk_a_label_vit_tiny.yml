# =========================== Branch VK ===========================
# VG (US-Net-dagger on the ViT with the label on every width) on Tiny
# ImageNet. Read VL against it.
#
# The ViT protocol of the CIFAR pilot moved to Tiny ImageNet (200
# classes, 64 pixels, 100k training images): the same ViT (dim 384, 8
# heads of 48, depth 7, MLP ratio 2) with patch 8, so 64 tokens as on
# CIFAR with patch 4 and about the same cost per image; the same AdamW
# recipe, augmentation (data.tinyimagenet_vit: crop and flip as the
# ResNets, plus RandAugment and random erasing; mixup/cutmix and label
# smoothing in train.py) and 100 epochs; seed 1995. Slimmable ViT papers
# report ImageNet-1K only, so there is no published number here either;
# Tiny ImageNet is the step between the CIFAR pilot and ImageNet.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.tinyimagenet
data_transforms: data.tinyimagenet_vit
data_loader: data.tinyimagenet
dataset_dir: data
data_loader_workers: 2
num_classes: 200
image_size: 64
topk: [1, 5]
randaug_ops: 2
randaug_magnitude: 9
random_erasing: 0.25
mixup: 0.8
cutmix: 1.0
mix_switch_prob: 0.5
label_smoothing: 0.1

# optimizer
optimizer: utils.adamw_optimizer
weight_decay: 0.05
grad_clip: 5.0
lr: 0.001
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 3

# info
profiling: [gpu]
pretrained: ''
resume: ''
test_only: False
random_seed: 1995
batch_size: 64
reset_parameters: True
log_dir: logs/smoke_vk_a_label_vit_tiny
max_iters_per_epoch: 3

# slimmable
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
# LayerNorm only: the cal phase recomputes nothing and is kept so the
# reported numbers come from the same post-training pass as every row
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true
model: models.us_vit
vit_dim: 384
vit_depth: 7
vit_heads: 8
vit_patch: 8
vit_mlp_ratio: 2
drop_path: 0.1
width_mult: 1.0
vit_slicing: fractional
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
width_mult_list_test: [0.25, 0.375, 0.5, 1.0]
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False

# =========================== Label on every width ===========================
student_ce_weight: 1.0
