# =========================== Branch BP ===========================
# K plus one learnable scalar per width on each residual branch. 128
# parameters.
#
# The residual add is the one place per-width BN recalibration cannot
# reach. body and shortcut each end in a BatchNorm, so their scales are
# pinned by gamma - but the tensor they are added into has no BatchNorm
# after it, and gamma and beta are shared across all sixteen widths. So
# the branch-to-skip ratio on the residual stream drifts with width and
# nothing corrects it.
#
# Two literatures arrive here independently. REPAIR gets its extra
# mileage over BN reset by correcting residual-block outputs specifically
# - on ResNet-50 it moves an interpolation midpoint from 53.2 to 56.5 -
# and states that on conv outputs alone it is "mathematically equivalent
# to resetting the BatchNorm statistics". NeFL, on CIFAR-100 ResNet-18,
# makes one learnable step size per residual block private per submodel
# and reports +0.95 mean and +3.34 worst-case over a US-Net-equivalent
# baseline, with the note that initial values above 1.0 degrade.
#
# Init 1.0, so epoch zero is exactly K. Training draws widths from a
# continuum, so a width uses the nearest of the sixteen tested slots; the
# sixteen evaluated widths hit their own slot exactly.
#
# Honest about the claim this costs: sixteen private scalar sets are
# per-width parameters, which weakens "one set of weights". The
# mitigation is that sixteen sets of BN running statistics already ship,
# so this privatises 128 numbers on top of state the model already
# carries, and they fold into nothing at deployment - they are read at
# inference.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bp_width_scalars
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature
width_scalars: True
