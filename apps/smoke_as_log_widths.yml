# =========================== Branch AS ===========================
# K with the sandwich rule's free samples drawn flat in log width
# instead of flat in width.
#
# US-Net draws them uniformly and gives no reason. On this supernet that
# spends the budget in the wrong half: A gains 3.10 points across 0.25
# to 0.50 and 1.90 across 0.55 to 1.00, so the curve is twice as steep
# at the narrow end, while a uniform draw puts two thirds of its samples
# in the flat half. Measured over 200k draws, log moves that from 33 per
# cent below width 0.50 to 50 per cent.
#
# Nothing else changes. No extra term, no extra forward pass, the same
# number of widths per step. If the samples landing somewhere else is
# worth anything, this is where it shows.
#
# Read against AT, which leans the other way. The pair is a bracket: if
# neither beats K then where the free samples land does not matter, and
# that closes the question rather than leaving it open.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_as_log_widths
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
width_sampling: log
feature_weight: 1.0
horizontal_where: feature
