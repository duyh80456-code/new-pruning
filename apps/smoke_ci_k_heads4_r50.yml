# =========================== Branch CI ===========================
# K on ResNet-50, with head_groups: 4. Identical to BY otherwise.
#
# From SOLAR (WACV 2026), which gives every subnet of a once-for-all
# network its own classifier over the shared backbone and reports better
# accuracy and calibration: the subnets stop fighting over one set of
# logit weights. SOLAR's subnets are a fixed eight. Here the width is
# continuous, so there cannot be one head per width. The range 0.25 to
# 1.00 is cut into four equal bands, 0.25-0.40, 0.45-0.60, 0.65-0.80 and
# 0.85-1.00 at the test widths, four test widths to a band, and every
# width in a band reads that band's head. This is an adaptation, not
# SOLAR: it keeps the network runnable at any width, which one head per
# test width would not.
#
# The widest band's head keeps the name classifier, so the teacher, the
# class cost matrix and every other reader of the classifier see the
# widest width's head. The backbone, the sampler and the loss are BY's.
# The three extra heads, 2048 by 100 each, add 0.6M parameters to 23.7M.
#
# The sandwich rule always runs 0.25 and 1.00, so the first and last
# heads train every step; the two middle heads train only when a free
# width lands in their band, about 44 per cent of steps each. Their
# rows see fewer updates, which is part of what is being tested.
#
# Read CI against BY. If CI beats BY, the heads and the transport add
# up. The NLL column matters as much as top-1: SOLAR claims calibration,
# and so does K.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_ci_k_heads4_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature

# Deferred, K holds all four widths' graphs until the end of the step:
# 19.3 GB at batch 256 on ResNet-50, and a T4 has 15. Only the pair term
# needs two widths at once, and its gradient splits exactly into one part
# per side, so each width takes its part with the partner detached and is
# freed. Same gradient to a relative 5e-8 on ResNet-18, checked against
# the deferred path through train.py's own loop. Costs one extra forward
# without a graph per step.
split_pair_backward: True
head_groups: 4
