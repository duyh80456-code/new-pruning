# =========================== Branch BF ===========================
# The window this is built to create.
#
# Sorting the channels only pays inside a window: late enough that the
# criterion is not noise on near-random weights, early enough that the
# prefix is not already sorted and there is training left to use it.
# US-Net has no such window. What makes a criterion meaningful here is
# the prefix taking gradient at every width and having to classify
# alone at 0.25, and that is the same thing that sorts it. Measured on
# a finished K the prefix already is 96 to 98 per cent of the best
# quarter by every criterion tried; on a fresh model it is 29.
#
# Once-for-All gets the window for free by making width elastic last:
# until that stage no position is asked for anything the others are
# not, so the weights mature while the ordering stays arbitrary.
#
# So these hold the narrow end back for the first 10 epochs. Only
# width 1.0 trains, which costs less than a sandwich step rather than
# more, so the branch spends less total compute than K, not more. The
# total stays at 100 epochs; the warm-up comes out of the budget and
# not on top of it, because every schedule in common use rescales with
# the total and 110 epochs would be a different run, not a longer one.
#
# The narrow widths get 90 epochs instead of 100, which is a
# handicap. It makes this a one sided test: a win is clean because it
# won despite the handicap, a loss says nothing.
#
# No permutation. This is the control for BD: the same warm-up,
# the same budget, the same handicap, and nothing sorted. Whatever the
# warm-up is worth by itself, this is where it shows.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bf_warm10_plain
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
narrow_start_epoch: 10
reorder_report: True
feature_weight: 1.0
horizontal_where: feature
