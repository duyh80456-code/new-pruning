# =========================== Branch DS ===========================
# K as DD (ResNet-50, post-ReLU read, feature transport from epoch 6,
# seed 1995, 77.50) with a low-rank update to every conv kernel that is a
# continuous function of the width (lora_knots, lora_rank). Every width
# slices the same kernel, so a wide width's gradient rewrites the leading
# channels the narrow ones run on; the update lets each width differ
# from the shared kernel by a little, LoRA used not to fine-tune but to
# give widths private weights. Its up matrices start at zero, so epoch
# zero is DD. Here two knots, at the ends of the range, rank 8 each: width w mixes the
# narrowest end's update and the widest end's linearly, so the update
# slides from one to the other across the range. 1.27M stored
# parameters on 23.7M (5.4%), none at inference: a chosen width's update
# merges into its kernel. DR spends the same 1.27M on four knots of
# rank 4 instead: more local in width, less expressive at each knot.
# Read against DD.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_ds_k_late_lora2x8_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature

# Deferred, K holds all four widths' graphs until the end of the step:
# 19.3 GB at batch 256 on ResNet-50, and a T4 has 15. Only the pair term
# needs two widths at once, and its gradient splits exactly into one part
# per side, so each width takes its part with the partner detached and is
# freed. Same gradient to a relative 5e-8 on ResNet-18, checked against
# the deferred path through train.py's own loop. Costs one extra forward
# without a graph per step.
split_pair_backward: True

feature_start_epoch: 6

# =========================== LoRA ===========================
lora_knots: 2
lora_rank: 8
