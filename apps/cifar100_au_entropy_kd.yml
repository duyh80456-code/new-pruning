# =========================== Branch AU ===========================
# K with the KD term weighted by the teacher's entropy, per sample.
#
# The measurement this exists for: at width 1.0 the supernet reaches a
# training error of 0.000. Its soft target is one hot in all but name on
# almost every sample, and KD is then repeating the label it already
# has. Six branches at the logit tier landing within 0.8 points of each
# other is what that predicts, since every divergence agrees in front of
# a one hot target.
#
# AR tried to fix it by softening the teacher globally, temperature 4,
# and came out at 73.38 with NLL 1.522, worse calibrated than the thing
# it was meant to repair. This tries the other handle. The teacher is
# not uniformly memorized: on some samples it still hesitates, and its
# entropy says which. Weight KD by that, normalised to mean one so the
# term's scale is unchanged and only its attention moves.
#
# Free. No extra forward, no extra parameter, one reduction over a
# tensor that is already in memory.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_au_entropy_kd
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
kd_weighting: entropy
feature_weight: 1.0
horizontal_where: feature
