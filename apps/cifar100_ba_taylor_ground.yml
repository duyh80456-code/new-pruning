# =========================== Branch BA ===========================
# K with the feature transport charging each channel by |f * dL/df|,
# the first order estimate of what zeroing it would cost.
#
# The score the others stand in for. Measured on K's checkpoint at the
# pooled tap, at the middle widths this term runs between, the top half
# of the channels carries 81 to 87 per cent of it and only 44 to 66 per
# cent are effective at all. K charges every channel the same, so most
# of the distance being minimised is distance along channels that carry
# nothing.
#
# It cannot be computed from the batch in hand. The gradient it needs
# comes from a loss that contains this term, so the value for this step
# does not exist while this step is being built. The loss keeps a
# running average over the steps already taken and uses that, detached,
# which makes it a constant to the current graph rather than a circular
# reference. Stale by one step, which is the price; the alternative is
# a second backward pass for every width.
#
# For the first fifty updates there is no estimate and the branch is K
# exactly, not K with an arbitrary weight. tests/test_kd_variants.py
# holds that, and holds that the estimate ends up tracking the gradient
# rather than the activation, or this would be AZ under another name.
#
# Nearly free. A hook on the feature and one reduction; the gradient is
# already computed.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_ba_taylor_ground
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weighting: taylor
feature_weight: 1.0
horizontal_where: feature
