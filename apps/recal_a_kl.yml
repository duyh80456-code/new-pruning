# =========================== Recalibrate only ===========================
# Loads a trained supernet and runs nothing but BN post-statistics.
#
# test_only with width_mult_list_test set is the path train.py already had:
# it flips test_only off, sets skip_training, and drops straight through to
# calibration, so the training loop never runs. A minute on one card
# instead of three hours.
#
# Use it to repair a run made before the calibration fix, or to read an
# existing supernet at a set of widths it was never evaluated at.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: logs/cifar100_a_kl/best_model.pt
resume: ''
test_only: True

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/recal_a_kl
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
