# =========================== Branch KI ===========================
# US-Net on ImageNet-100 (the seed-1993 subset, full resolution) with
# ResNet-50, seed 1995: BX with the data and recipe moved to
# ImageNet (224 inputs, torchvision stem, batch 128, lr 0.05, weight
# decay 1e-4) and nothing else changed. See
# scripts/build_imagenet100.py.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-geforce-rtx-4090"

# data
dataset: imagenet1k
data_transforms: imagenet1k_basic
data_loader: imagenet1k_basic
dataset_dir: /home/s24gbn1/Documents/vinhpad/data/seed_1993_subset_100_imagenet/data
data_loader_workers: 16

# info
num_classes: 100
image_size: 224
stem: imagenet
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0001
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.05
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 128
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_ki_a_r50_in100
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 40
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
