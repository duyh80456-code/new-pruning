# =========================== Branch VC ===========================
#
# VB without Delayed Transport: both transport terms from epoch 1. On
# ResNet the trivial solution of the transport terms (two clouds at one
# point cost nothing) became a trap because the ReLU stopped the KL
# gradient that would pull a dead width out (CR, CU). A ViT has GELU and
# LayerNorm instead; this asks whether the trap exists there. Read against
# VB: level or above means Delayed Transport is a ReLU matter, a collapse
# means it is general.
#
# The ViT protocol, shared by every row of the ViT table: CIFAR-100, a
# ViT with patch 4, dim 384, 8 heads of 48, depth 7, MLP ratio 2 (8.4M
# parameters, 0.56 GMACs at full width); AdamW lr 1e-3, weight decay
# 0.05, 10 warm-up epochs, cosine, batch 256, 100 epochs; RandAugment
# (2, 9), random erasing 0.25, mixup 0.8 / cutmix 1.0, label smoothing
# 0.1; drop path 0.1; no external teacher; seed 1995. The common grid is
# k/8 (0.25, 0.375, ..., 1.0): every method trains or reads those widths,
# and at one width every slicing has the same embedding width and so the
# same MACs.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100_vit
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2
num_classes: 100
image_size: 32
topk: [1, 5]
randaug_ops: 2
randaug_magnitude: 9
random_erasing: 0.25
mixup: 0.8
cutmix: 1.0
mix_switch_prob: 0.5
label_smoothing: 0.1

# optimizer
optimizer: utils.adamw_optimizer
weight_decay: 0.05
grad_clip: 5.0
lr: 0.001
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 3

# info
profiling: [gpu]
pretrained: ''
resume: ''
test_only: False
random_seed: 1995
batch_size: 64
reset_parameters: True
log_dir: logs/smoke_vc_k_early_heads4_vit
max_iters_per_epoch: 3

# slimmable
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
# LayerNorm only: the cal phase recomputes nothing and is kept so the
# reported numbers come from the same post-training pass as every row
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true
model: models.us_vit
vit_dim: 384
vit_depth: 7
vit_heads: 8
vit_patch: 4
vit_mlp_ratio: 2
drop_path: 0.1
width_mult: 1.0
vit_slicing: fractional
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
width_mult_list_test: [0.25, 0.375, 0.5, 1.0]
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature
split_pair_backward: True
feature_start_epoch: 0
head_groups: 4
