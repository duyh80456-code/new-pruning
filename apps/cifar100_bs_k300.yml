# =========================== Branch BS ===========================
# K at 300 epochs, the pair for BR.
#
# Why 300 and not 110. CIFAR-100 convention is longer than this project has
# been using: CRD trains at 240 epochs, the standard pytorch-cifar100
# ResNet-18 baseline at 200. The protocol gap is not small - WRN-40-1
# scores 71.98 at 240 epochs against 69.11 at 200, the same architecture
# either way. So 100 was short by the standards of the dataset, and every
# number in this table was read under it.
#
# The specific reason to expect more here than in a single network, though,
# is the granularity count. make_divisible with divisor 8 collapses the
# uniform draw on [0.25, 1.0] to exactly 90 distinct networks, and the
# sandwich rule activates four of them per step, so an intermediate width
# sees on the order of 2/(90-2) of the total - about 2.3 epochs out of 100.
# Tripling the budget triples that. Scala prices this directly and HydraViT
# reports the same shape from the other side: their many-subnet penalty is
# 0.7 points at 300 epochs and gone by 800.
#
# Read against the 100-epoch rows, not against each other alone. If both A
# and K gain about the same, the epoch budget was simply short and every
# delta in this project survives. If K's margin over A shrinks, part of
# that +0.75 was K converging faster rather than converging better, which
# is a different claim and one the table cannot currently distinguish.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 300

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bs_k300
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature
