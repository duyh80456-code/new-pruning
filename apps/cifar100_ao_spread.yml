# =========================== Branch AO ===========================
# K plus a repulsion on the classifier rows.
#
# Every other term in this project is a pull: two distributions are
# compared and the gap is charged. This is the opposite, and it exists
# because of a measurement. The class cost matrix on a trained supernet
# has a spread of 1.32 between its nearest and farthest pairs, against
# 3.79 for an embedding with real structure, so six branches at the logit
# tier were doing transport over a metric carrying almost nothing.
#
# Rather than move to a tier where geometry exists, this puts geometry
# where it was missing.
#
# spread_weight has no counterpart to be matched against, since it touches
# the classifier rows alone where every other term reaches the whole
# network. Measured against what cross entropy already does to those same
# rows: at weight 1.0 the repulsion is 11% of their gradient, at 0.1 it is
# 1.1%, which would have been too little to move anything. 5.0 would be
# 54% and is the next rung if the cost spread does not shift.
#
# Whether it shifted is readable without another run: the probe cell in
# the notebooks prints the spread of the trained classifier, so this
# branch reports whether the mechanism worked separately from whether the
# accuracy moved.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_ao_spread
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
spread_neighbours: 5
spread_weight: 1.0
feature_weight: 1.0
horizontal_where: feature
