# =========================== Branch CA ===========================
# MutualNet (Yang et al., ECCV 2020, arXiv 1909.12978): width and input
# resolution learned together. Code: github.com/taoyang1122/MutualNet.
#
# Same protocol as every row in the table: ResNet-18, CIFAR-100, 100
# epochs, batch 256, lr 0.2, the sixteen widths 0.25 to 1.00 read after BN
# post-statistics, seed 1995. Implemented from the authors' released code
# rather than from the paper alone, and where the two disagree the code
# wins; the differences are listed below.
#
# The widest width always sees the full 32x32 image and the hard label.
# Each other width - the narrowest and the two free ones - sees the batch
# resized to one of resolution_list at random and learns from the full
# network by KL. resolution_list is their own CIFAR config
# (apps/wideresnet.yml), and the resize is theirs: bilinear,
# align_corners True, after augmentation.
#
# Differences. MutualNet reports each width at whichever resolution gives
# the best accuracy for its FLOPs; this table reads every width at 32, the
# same way every other row is read. Their CIFAR experiments use
# WideResNet-28-10, not ResNet-18.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_ca_mutualnet
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False

# =========================== ca_mutualnet ===========================
resolution_list: [32, 28, 24, 20]
