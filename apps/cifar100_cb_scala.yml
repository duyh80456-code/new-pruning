# =========================== Branch CB ===========================
# Scala (Zhang et al., NeurIPS 2024, arXiv 2412.04786). Code:
# github.com/BeSpontaneous/Scala-pytorch.
#
# Same protocol as every row in the table: ResNet-18, CIFAR-100, 100
# epochs, batch 256, lr 0.2, the sixteen widths 0.25 to 1.00 read after BN
# post-statistics, seed 1995. Implemented from the authors' released code
# rather than from the paper alone, and where the two disagree the code
# wins; the differences are listed below.
#
# All four components, from engine_scala.py and models_scala.py:
#   isolated activation  the narrowest width takes the last channels of
#                        every layer instead of the first
#   stable sampling      one free width from each half of the range, on a
#                        grid
#   progressive KD       each width learns from the next larger one
#                        sampled in the step (teacher_chain)
#   noise calibration    every student also takes the hard label, weight
#                        1.0 (ce_coefficient)
# plus full_warm_epoch 10: the widest width alone for the first 10 epochs.
#
# Differences. Scala distils the full model from a separately pretrained
# DeiT; there is no external teacher in this project, so the widest width
# trains on the hard label as in US-Net. Their grid step is 0.0625, giving
# their 13 widths; 0.05 here gives this table's 16, so every width Scala
# trains is one the table reads. Scala is a ViT method; its paper runs one
# CNN (MobileNetV2) and no CIFAR.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_cb_scala
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False

# =========================== cb_scala ===========================
narrow_start_epoch: 10
teacher_chain: True
width_sampling: stable
stable_granularity: 0.05
student_ce_weight: 1.0
isolate_smallest: True
