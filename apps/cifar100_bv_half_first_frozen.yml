# =========================== Branch BV ===========================
# Settle half the network first: width 0.50 alone for 25 epochs, then
# hold that block still.
#
# BT settles the width-0.25 block, which is 710,576 weights - 6.3 per
# cent. This settles the width-0.50 block instead: 2,815,840 weights,
# 25.1 per cent, four times as much. If the narrow-first order helps at
# all, this says whether it helps in proportion to how much of the
# prefix is settled before the rest is allowed to move, or whether 6.3
# per cent was already the whole effect.
#
# The curriculum width and the freeze width have to match. Freezing 0.50
# after a phase that ran 0.25 alone would lock the channels between them
# at their initialisation, and the branch would be measuring a partly
# random network rather than a settled one.
#
# Read the five rows of this axis together. Large-first is BF at -0.36
# and BG at -0.49 against K; small-first is BU without a freeze, BT with
# one at 0.25, and these two moving the two knobs a freeze has - how much
# of the network is settled before the rest may move, and for how long.
#
# The same counterweight applies as on notebook 28: thirteen measurements
# in the literature say the small end is rescued by weight sharing and the
# large end pays for it, so settling the small end may be protecting the
# half that was never in trouble.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bv_half_first_frozen
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 1.0
horizontal_where: feature
narrow_first_epochs: 25
narrow_first_width: 0.5
freeze_prefix_at: 0.5
