# =========================== Branch DG ===========================
# WKD-L (Lv et al., "Wasserstein Distance Rivals Kullback-Leibler
# Divergence for Knowledge Distillation", NeurIPS 2024, arXiv
# 2412.08139) as US-Net's inplace distillation loss on ResNet-50: the
# published Wasserstein KD dropped into the setting K works in, so the
# table can tell K's design from Wasserstein KD as such. From their
# mdistiller/distillers/WKD.py and configs/cifar100/wkd_l: the target
# class distilled on its own at temperature 1, the other 99 renormalised
# at temperature 8 and transported under a class cost 1 - exp(-(1 -
# cos)) between classifier rows, Sinkhorn at 0.05 for 10 iterations,
# weight 600 cosine-decayed to zero over the last 37.5% of training, and
# CE on the label for every student at weight 1. Differences: their cost
# comes from a pretrained teacher's CKA prototypes, and US-Net has no
# pretrained teacher, so this uses their fc option on the shared
# classifier, recomputed every step; WKD-F is left out, because its
# projector maps one student to one teacher and a universally slimmable
# network has no fixed set of students to give one each. Identical to BX
# otherwise.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_dg_wkd_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: wkd
wkd_weight: 600.0
wkd_temperature: 8.0
wkd_reg: 0.05
wkd_iters: 10
wkd_decay_from: 0.625
student_ce_weight: 1.0
horizontal_kd: False
