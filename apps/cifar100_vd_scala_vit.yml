# =========================== Branch VD ===========================
#
# Scala (NeurIPS 2024) on the ViT (Scala†), from the authors' code,
# BeSpontaneous/Scala-pytorch (models_scala.py, engine_scala.py); where
# paper and code differ the code wins.
#   slicing      int(w * 384) channels and int(w * 768) hidden; the
#                narrowest and widest widths take the first channels of
#                every tensor, every width between the last ones
#                (isolated activation); qkv cut as one block and reshaped
#                to all 8 heads (vit_slicing: scala)
#   sampling     widest, narrowest, one width on the grid in each half
#                (stable sampling, granularity 1/8 = the common grid)
#   distillation each width from the next larger one in the step
#                (progressive KD), every student also on the label at 1.0
#   warm-up      the widest width alone for the first 10 epochs
# Differences: no external DeiT teacher (their code path
# distillation_type none, which the protocol uses for every row); grid
# 1/8 instead of their 1/16, so every width it trains is a grid point;
# the protocol's recipe instead of theirs (theirs: RandAugment m1). Read
# at the grid only: its slicing needs d to divide by 8.
#
# The ViT protocol, shared by every row of the ViT table: CIFAR-100, a
# ViT with patch 4, dim 384, 8 heads of 48, depth 7, MLP ratio 2 (8.4M
# parameters, 0.56 GMACs at full width); AdamW lr 1e-3, weight decay
# 0.05, 10 warm-up epochs, cosine, batch 256, 100 epochs; RandAugment
# (2, 9), random erasing 0.25, mixup 0.8 / cutmix 1.0, label smoothing
# 0.1; drop path 0.1; no external teacher; seed 1995. The common grid is
# k/8 (0.25, 0.375, ..., 1.0): every method trains or reads those widths,
# and at one width every slicing has the same embedding width and so the
# same MACs.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100_vit
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2
num_classes: 100
image_size: 32
topk: [1, 5]
randaug_ops: 2
randaug_magnitude: 9
random_erasing: 0.25
mixup: 0.8
cutmix: 1.0
mix_switch_prob: 0.5
label_smoothing: 0.1

# optimizer
optimizer: utils.adamw_optimizer
weight_decay: 0.05
grad_clip: 5.0
lr: 0.001
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 10
num_epochs: 100

# info
profiling: [gpu]
pretrained: ''
resume: ''
test_only: False
random_seed: 1995
batch_size: 256
reset_parameters: True
log_dir: logs/cifar100_vd_scala_vit

# slimmable
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
# LayerNorm only: the cal phase recomputes nothing and is kept so the
# reported numbers come from the same post-training pass as every row
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true
model: models.us_vit
vit_dim: 384
vit_depth: 7
vit_heads: 8
vit_patch: 4
vit_mlp_ratio: 2
drop_path: 0.1
width_mult: 1.0
vit_slicing: scala
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
width_mult_list_test: [0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0]
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
width_sampling: stable
stable_granularity: 0.125
teacher_chain: True
student_ce_weight: 1.0
narrow_start_epoch: 10
