# =========================== Branch C ===========================
# Wasserstein on the logits, vertical only: W(student_c, teacher) in place
# of KL. The class cost matrix is read off the shared classifier rows, so
# the metric is the model's own rather than one imposed from outside.

# machine info
num_gpus_per_job: 8
num_cpus_per_job: 63
memory_per_job: 380
gpu_type: "nvidia-tesla-p100"

# data
dataset: imagenet1k
data_transforms: imagenet1k_mobile
data_loader: imagenet1k_basic
dataset_dir: data/imagenet
data_loader_workers: 62

# info
num_classes: 1000
image_size: 224
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0001
nesterov: True

# lr
lr: 0.5
lr_scheduler: linear_decaying
num_epochs: 250

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 1024
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/kd_c_wasserstein
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 5
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_mobilenet_v1
width_mult: 1.0
width_mult_list: [0.25, 0.275, 0.3, 0.325, 0.35, 0.375, 0.4, 0.425, 0.45, 0.475, 0.5, 0.525, 0.55, 0.575, 0.6, 0.625, 0.65, 0.675, 0.7, 0.725, 0.75, 0.775, 0.8, 0.825, 0.85, 0.875, 0.9, 0.925, 0.95, 0.975, 1.0]
width_mult_range: [0.25, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: wasserstein
sinkhorn_eps: 0.05
sinkhorn_iters: 50
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: False
