# =========================== Branch BL ===========================
# K with Gromov transport, which never puts the two widths' channels in
# correspondence at all.
#
# Every other feature loss here has to say how a coordinate of the wide
# cloud corresponds to a coordinate of the narrow one. prefix answers by
# truncation: at width 0.25 it discards 384 of 512 wide channels and
# asserts narrow channel i is wide channel i. That assertion is false in
# function space - narrow channel i is computed from k input channels
# and wide channel i from all of them, so they are different functions.
#
# Gromov compares how far sample i is from sample k inside one cloud
# against the same pair inside the other. No correspondence is needed
# and no channel is discarded. FeatureGromovLoss has been in loss_ops
# since the transport sweep and has never been run once.
#
# This is a prediction, not variant 35. The two widths see the same
# batch, so the sample correspondence is already known and trivial. If
# the solver returns the identity coupling the objective collapses to a
# distance between the two clouds' own distance matrices - a three-line
# relation loss, not transport. If it returns anything else it is
# matching image i to image j, which is wrong supervision. Either result
# says something prefix alignment cannot.
#
# feature_align is accepted and dropped by this loss, by construction.
#
# feature_weight is 413.8, from scripts/calibrate_feature_weight.py, the
# same weight/grad rule q, r and s use. At weight 1.0 this term
# contributes a gradient of 0.0088 against entropic transport's 3.6502,
# so the first version of this config was K with no horizontal term at
# all: the branch suite scored it at 18.4496, which is a_kl to four
# decimals. Worth stating plainly that a term needing 414x amplification
# to be felt is a weak signal, and that the calibration is one
# measurement on an untrained model, so the ratio drifts as the widths
# converge.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bl_gromov
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_loss: gromov
gromov_inner_iters: 50
gromov_outer_iters: 5
feature_align: prefix
feature_weight: 413.8
horizontal_where: feature
