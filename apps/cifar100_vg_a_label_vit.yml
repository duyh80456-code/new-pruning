# =========================== Branch VG ===========================
# VA (US-Net on the ViT, US-Net-dagger) with the label on every width:
# each student takes CE on the hard label at weight 1.0 beside its
# inplace distillation, as Scala does. Identical to VA otherwise.
#
# Why: VA read 35.62 on the k/8 grid, 38.65 at width 1.0 against
# HydraViT-dagger's 53.76 on the same slicing. Local 8-epoch runs traced
# it to students trained on KD alone: under mixup and label smoothing the
# widest stays near uniform for many epochs, and the KD-only students
# drag the shared prefix. At epoch 8, width 1.0: VA 8.3 restricted to the
# grid (so not the partial heads), 17.9 with the label on every width;
# width 0.25 went from 5.8 to 15.7.
#
# Read against VD (Scala-dagger, 55.23) and VE (HydraViT-dagger, 49.41):
# the base is fixed only if VG lands near them. VH is read against VG.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100_vit
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2
num_classes: 100
image_size: 32
topk: [1, 5]
randaug_ops: 2
randaug_magnitude: 9
random_erasing: 0.25
mixup: 0.8
cutmix: 1.0
mix_switch_prob: 0.5
label_smoothing: 0.1

# optimizer
optimizer: utils.adamw_optimizer
weight_decay: 0.05
grad_clip: 5.0
lr: 0.001
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 10
num_epochs: 100

# info
profiling: [gpu]
pretrained: ''
resume: ''
test_only: False
random_seed: 1995
batch_size: 256
reset_parameters: True
log_dir: logs/cifar100_vg_a_label_vit

# slimmable
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
# LayerNorm only: the cal phase recomputes nothing and is kept so the
# reported numbers come from the same post-training pass as every row
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true
model: models.us_vit
vit_dim: 384
vit_depth: 7
vit_heads: 8
vit_patch: 4
vit_mlp_ratio: 2
drop_path: 0.1
width_mult: 1.0
vit_slicing: fractional
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
width_mult_list_test: [0.25, 0.3, 0.35, 0.375, 0.4, 0.45, 0.5, 0.55, 0.6, 0.625, 0.65, 0.7, 0.75, 0.8, 0.85, 0.875, 0.9, 0.95, 1.0]
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False

# =========================== Label on every width ===========================
student_ce_weight: 1.0
