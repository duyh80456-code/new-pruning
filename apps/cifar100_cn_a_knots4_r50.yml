# =========================== Branch CN ===========================
# A on ResNet-50 with affine_knots: 4. Identical to BX otherwise. Every
# BN scale and shift becomes a continuous function of the width. US-Net
# shares one gamma and one beta across all widths and recalibrates only
# the running statistics, so whatever a width needs from the affine half
# it cannot have. BP, which gave each of the sixteen test widths one
# private scalar per residual branch snapped to the nearest slot, is the
# top of the ResNet-18 table at 74.35, 0.09 over K and inside the noise.
# This is the same freedom made per channel and continuous: an offset to
# gamma and to beta at each of four knots, widths 0.25, 0.50, 0.75 and
# 1.00, interpolated linearly between them, so every width in the range
# has its own affine and neighbouring widths have nearly the same one.
# It covers BP: scaling the last BN of a residual body scales the body.
# The offsets start at zero, so epoch zero is BX, and they stay out of
# weight decay like gamma and beta. Read CN against BX. It says whether
# the gain, if CM has one, needs the transport term or stands on its
# own.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_cn_a_knots4_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
affine_knots: 4
