# =========================== Branch KN ===========================
# KH (SlimOT, eps 0.2, ImageNet-100, ResNet-50, seed 1995) with the
# Teacher Transport weight cut from 1 to 0.25 and nothing else changed.
# KH fits the training set 2.7 points below US-Net (KI) at width 0.25 and
# 0.6 at width 1.0, and the gap holds flat over the last 20 epochs, so
# SlimOT reads as regularising too hard there. Teacher pulls the narrow
# widths hardest, and on CIFAR-100 its weight is flat from 0.25 to 1
# (JA 77.80, DO 77.84) while Peer loses below 1. Read against KH and KI.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-geforce-rtx-4090"

# data
dataset: imagenet1k
data_transforms: imagenet1k_basic
data_loader: imagenet1k_basic
dataset_dir: /home/s24gbn1/Documents/vinhpad/data/seed_1993_subset_100_imagenet/data
data_loader_workers: 16

# info
num_classes: 100
image_size: 224
stem: imagenet
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0001
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.05
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 128
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_kn_k_heads4_r50_in100_tw025
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 40
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weight: 0.25
horizontal_where: feature

# Deferred, K holds all four widths' graphs until the end of the step:
# 19.3 GB at batch 256 on ResNet-50, and a T4 has 15. Only the pair term
# needs two widths at once, and its gradient splits exactly into one part
# per side, so each width takes its part with the partner detached and is
# freed. Same gradient to a relative 5e-8 on ResNet-18, checked against
# the deferred path through train.py's own loop. Costs one extra forward
# without a graph per step.
split_pair_backward: True

feature_start_epoch: 6

# =========================== Heads ===========================
head_groups: 4
