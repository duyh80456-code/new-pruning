# =========================== Branch DB ===========================
# DYNAS (Jeon et al., CVPR 2025, arXiv 2503.10740) on US-Net, ResNet-50:
# complexity-aware learning rates and momentum separation. Each width's
# rate decays as (1 - t/T)^p after the usual 5-epoch warm-up, p = 4 at
# width 0.25 down to 1/4 at 1.0, linear in log parameters; widths fall
# into four equal bins of the range, each with its own SGD momentum over
# the shared weights. Each sampled width takes its own update through
# its bin's optimizer, as DYNAS steps one sub-network at a time, with
# weight decay divided by the four widths a step runs. Implemented from
# their released train_spos.py; see utils/dynas.py for the adaptation
# from NAS-Bench-201 to the sandwich rule. Identical to BX otherwise.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_db_dynas_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False

dynas: True
dynas_groups: 4
dynas_max_coeff: 4.0
