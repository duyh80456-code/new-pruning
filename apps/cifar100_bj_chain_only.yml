# =========================== Branch BJ ===========================
# A with each width taught by the next larger one, and nothing else.
#
# The missing cell of a two by two. AW is K plus this chaining and leads
# at 74.32; K alone is 74.26; A is 73.52. Chaining has only ever been
# measured sitting on top of the transport term, where it is worth +0.06,
# which cannot say whether it does anything by itself.
#
# This is that branch: teacher_chain on the published US-Net loss, with
# no transport anywhere. Near 73.5 says the transport term is the only
# active ingredient and the report has one claim to make. Near 74.3 says
# chaining reaches the same place on its own and the two are redundant
# rather than additive, which is a different paper.
#
# One branch per GPU: each job is pinned to a single card with
# CUDA_VISIBLE_DEVICES and sees exactly one, so num_gpus_per_job is 1 and
# batch_size is what that one card carries. Two branches run at once.

# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_bj_chain_only
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
# the one change from A: the soft target a width learns from is the next
# larger width rather than the widest. train.py rebuilds chain_target
# from each width's own output, so the widths run widest first and are
# put back in order before any pairing. Nothing else is switched on.
teacher_chain: True
