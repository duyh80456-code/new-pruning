# =========================== Branch CD ===========================
#
# ResNet-50 version. Identical to BZ apart from `depth: 50` and the log
# directory, so it is read against BX and BY (A and K on ResNet-50), not
# against the ResNet-18 table. ResNet-50 costs 2.34 times the MACs of
# ResNet-18 at every width.
#
# DS-Net's in-place bootstrapping (Li et al., CVPR 2021, arXiv 2103.13258),
# on US-Net. Code: github.com/changlin31/DS-Net.
#
# Same protocol as every row in the table: ResNet-18, CIFAR-100, 100
# epochs, batch 256, lr 0.2, the sixteen widths 0.25 to 1.00 read after BN
# post-statistics, seed 1995. Implemented from the authors' released code
# rather than from the paper alone, and where the two disagree the code
# wins; the differences are listed below.
#
# The students learn from an exponential moving average of the network at
# its widest instead of from the network itself. From
# dyn_slim/apis/train_slim.py and configs/mobilenetv1_bn_uniform.yml:
# decay 0.997 per optimizer step, the EMA model kept in eval mode, the
# widest width trained on the hard label.
#
# Differences. The paper also gives the narrowest width an ensemble target
# (the EMA widest plus the EMA random widths); their released supernet
# config has ensemble_ib false, so it is off here. Their ablation puts it
# at +0.2 on the narrowest over EMA alone. Label smoothing, RandAugment and
# dropout from their ImageNet config are not used, to keep the protocol.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_cd_dsnet_r50
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False

# =========================== bz_dsnet ===========================
ema_teacher_decay: 0.997
