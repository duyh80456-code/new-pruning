# =========================== Branch AX ===========================
# K with the feature transport charging each channel by how much it
# varies across the batch, instead of charging them all the same.
#
# The measurement this exists for. At the pooled tap, at the middle
# widths the feature term actually runs between, the top half of the
# channels carries 81 to 87 per cent of the Taylor score and only 44 to
# 66 per cent of them are effective at all. K charges every one of them
# the same, so most of the distance it is minimising is distance along
# channels that carry nothing.
#
# Variance is the free stand-in for that score. A channel that does not
# vary across the batch says nothing about which sample is which, so
# distance along it is distance spent on nothing. Taylor itself needs
# the gradient of a loss that contains this very term, which is
# circular; variance needs no gradient, no state, and no buffer that
# has to be resliced when the width changes. Against Taylor it ranks
# the channels the same way to 0.78 at width 0.6, 0.84 at 0.5 and 0.83
# at 0.4, which is the range that matters here.
#
# Normalised to mean one, so this moves what the cost attends to and
# not how large it is. The same weight is used for the cross term and
# both self terms, or the debiasing would stop landing on zero;
# tests/test_kd_variants.py holds that fixed.
#
# Free. The variance is one reduction over a tensor already in memory.
# machine
num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 5
num_epochs: 100

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 1995
batch_size: 256
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/cifar100_ax_var_ground
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 20
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
sinkhorn_eps: 0.2
sinkhorn_iters: 100
sinkhorn_debiased: True
cost_normalize: True
horizontal_kd: True
horizontal_weight: 1.0
feature_kd: True
feature_align: prefix
feature_weighting: variance
feature_weight: 1.0
horizontal_where: feature
