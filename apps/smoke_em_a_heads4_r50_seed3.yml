# =========================== Branch EM ===========================
# CH (A with four band heads, US-Net + WBH) at seed 42, otherwise
# unchanged. CH is the row of the main table that has the heads and not
# the transport, so SlimOT + WBH against it isolates the transport's
# share. It had one seed (1995, 77.21); EM is its seed-42 partner of EJ
# (SlimOT + WBH at 42) and runs beside DH (A at 42) in notebook 54.
#
# The heads, from SOLAR (WACV 2026), adapted to continuous width: four
# equal bands of the range, 0.25-0.40, 0.45-0.60, 0.65-0.80, 0.85-1.00,
# each with its own classifier over the shared backbone. See CH's config
# for the full account.

num_gpus_per_job: 1
num_cpus_per_job: 4
memory_per_job: 30
gpu_type: "nvidia-tesla-t4"

# data
dataset: data.cifar100
data_transforms: data.cifar100
data_loader: data.cifar100
dataset_dir: data
data_loader_workers: 2

# info
num_classes: 100
image_size: 32
topk: [1, 5]

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
nesterov: True

# Four losses are summed into one step and the KD terms are not bounded
# the way cross entropy is, so one bad batch early can be unrecoverable.
grad_clip: 5.0

# lr
lr: 0.2
lr_scheduler: cosine_decaying
lr_warmup: True
lr_warmup_epochs: 1
num_epochs: 2

# model profiling
profiling: [gpu]

# pretrain, resume, test_only
pretrained: ''
resume: ''
test_only: False

random_seed: 42
batch_size: 64
max_iters_per_epoch: 3
reset_parameters: True

# =========================== Override Settings ===========================
log_dir: logs/smoke_em_a_heads4_r50_seed3
slimmable_training: True
universally_slimmable_training: True
num_sample_training: 4
bn_cal_batch_num: 2
calibrate_bn: true
cumulative_bn_stats: true

model: models.us_resnet
depth: 50
width_mult: 1.0
width_mult_list: [0.25, 1.0]
width_mult_range: [0.25, 1.0]
# widths that get a calibrated BN and an entry in the final table
width_mult_list_test: [0.25, 0.5, 0.75, 1.0]

# =========================== Distillation ===========================
inplace_distill: True
kd_loss: soft_ce
horizontal_kd: False
head_groups: 4
